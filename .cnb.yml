# UniStory Godot 4.6 构建配置
# 支持：Windows / Linux / Android 三平台导出
#
# 分支策略：
#   dev  - push: 构建 Android Debug APK（自动 debug 签名）
#   main - push: 全平台 CI 检查（不发布）
#   tag_push ($): 全平台构建 + Release 签名 + 创建 Release + 上传产物附件
#
# Android 签名说明见文件末尾注释和 README

# ── 公共构建环境 ──────────────────────────────────
.build-env: &build-env
  docker:
    build:
      dockerfile: Dockerfile.ci
      by:
        - Dockerfile.ci
      versionBy:
        - Dockerfile.ci
  env:
    PROJECT_NAME: UniStory
  services:
    - docker
  imports:
    - https://cnb.cool/mico-v/secerts/-/blob/main/android-release.yml

# ── 平台构建步骤 ──────────────────────────────────
.import-project: &import-project
  name: import-project
  script: |
    # 提前解压 Android 构建模板到项目目录，确保 Godot import 时能检测到 .template_version
    mkdir -p android/build
    unzip -qo /root/.local/share/godot/export_templates/4.6.stable/android_source.zip -d android/build
    godot --headless --import

# ── 质量门禁 ──────────────────────────────────────
# 对齐 GitHub Actions quality gate：Scenario lint（error 级别阻断）+ 20 项 headless 回归测试
.scenario-lint: &scenario-lint
  name: scenario-lint
  script: |
    echo "=== Scenario Lint (fail-on error) ==="
    python3 scripts/tools/scenario_lint.py --godot godot --fail-on error

.headless-tests: &headless-tests
  name: headless-tests
  script: |
    echo "=== Headless Regression Suite (20 tests) ==="
    python3 scripts/tests/run_headless_suite.py --godot godot --timeout 180

.build-windows: &build-windows
  name: Build Windows
  script: |
    # Each job has isolated workspace; must import first
    godot --headless --import
    mkdir -p release/win
    godot --headless --export-release "Windows Desktop" "release/win/$PROJECT_NAME.exe"

.build-linux: &build-linux
  name: Build Linux
  script: |
    # Each job has isolated workspace; must import first
    godot --headless --import
    mkdir -p release/linux
    godot --headless --export-release "Linux" "release/linux/$PROJECT_NAME.x86_64"
    chmod +x "release/linux/$PROJECT_NAME.x86_64"

.build-android-debug: &build-android-debug
  name: Build Android Debug
  script: |
    mkdir -p release/android
    # Must import first (before template extraction
    # to avoid Godot creating .import files in android/build/res/)
    godot --headless --import
    # Extract Android build template to project dir (required by Godot's gradle build)
    mkdir -p android/build
    unzip -qo /root/.local/share/godot/export_templates/4.6.stable/android_source.zip -d android/build
    # Godot requires this file to know the template version
    echo "4.6.stable" > android/.build_version
    # Prevent Godot from scanning/corrupting Android template resources during export
    touch android/build/.gdignore
    # Clean any stale .import files that Godot may create in the template dir
    find android/build -name "*.import" -delete 2>/dev/null || true
    # Debug 导出使用 Godot 内置 debug keystore，自动签名
    godot --headless --export-debug "Android" "release/android/$PROJECT_NAME-debug.apk"

.build-android-release: &build-android-release
  name: Build Android Release
  script: |
    mkdir -p release/android
    # Must import first (before template extraction
    # to avoid Godot creating .import files in android/build/res/)
    godot --headless --import
    # Extract Android build template to project dir (required by Godot's gradle build)
    mkdir -p android/build
    unzip -qo /root/.local/share/godot/export_templates/4.6.stable/android_source.zip -d android/build
    # Godot requires this file to know the template version
    echo "4.6.stable" > android/.build_version
    # Prevent Godot from scanning/corrupting Android template resources during export
    touch android/build/.gdignore
    # Clean any stale .import files that Godot may create in the template dir
    find android/build -name "*.import" -delete 2>/dev/null || true
    # ── Inject release keystore from secrets ──
    if [ -n "$ANDROID_KEYSTORE_B64" ]; then
      echo "$ANDROID_KEYSTORE_B64" | base64 -d > /root/release.jks
      echo 'export/android/keystore_release = "/root/release.jks"' >> /root/.config/godot/editor_settings-4.tres
      echo "export/android/keystore_release_user = \"$ANDROID_KEYSTORE_ALIAS\"" >> /root/.config/godot/editor_settings-4.tres
      echo "export/android/keystore_release_password = \"$ANDROID_KEYSTORE_PASS\"" >> /root/.config/godot/editor_settings-4.tres
      echo "=== Release keystore injected: /root/release.jks ==="
    else
      echo "=== ANDROID_KEYSTORE_B64 not set, skipping keystore injection ==="
    fi
    # Android Release 导出（如果注入了 keystore 则使用 release 签名）
    godot --headless --export-release "Android" "release/android/$PROJECT_NAME.apk" || \
      godot --headless --export-debug "Android" "release/android/$PROJECT_NAME.apk"
    # ── Verify APK signature ──
    echo "=== Verifying APK Signature ==="
    APK_PATH="release/android/$PROJECT_NAME.apk"
    if [ -f "$APK_PATH" ]; then
      echo "APK size: $(ls -lh "$APK_PATH" | awk '{print $5}')"
      if jarsigner -verify "$APK_PATH" 2>&1; then
        echo "✅ APK JAR signature verification PASSED"
      else
        echo "⚠️  APK JAR signature check returned non-zero (may still be valid v2/v3 signing)"
      fi
    else
      echo "❌ APK file not found!"
    fi

# ── dev 分支：Android Debug 构建并上传 commit 附件 ─
dev:
  push:
    - <<: *build-env
      name: android-debug-build
      stages:
        - *import-project
        - *scenario-lint
        - *headless-tests
        - *build-android-debug
        - name: package-android-debug
          script: |
            COMMIT_SHORT=$(echo "$CNB_COMMIT" | cut -c1-7)
            cp release/android/*.apk "$PROJECT_NAME-debug-$COMMIT_SHORT.apk" 2>/dev/null || true
            echo "=== 打包完成 ==="
            ls -lah *.apk 2>/dev/null || true
        - name: upload-debug-apk
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./*.apk"
      failStages:
        - name: notify-failure
          script: |
            echo "Dev Android build failed: $CNB_BUILD_ID"

# ── main 分支：全平台 CI 检查（不发布） ───────────
main:
  push:
    - <<: *build-env
      name: ci-check
      stages:
        - *import-project
        - *scenario-lint
        - *headless-tests
        - name: build-all-platforms
          jobs:
            windows: *build-windows
            linux: *build-linux
            android: *build-android-release

# ── 兜底分支（仓库级事件） ────────────────────────
$:
  # Tag 推送：全平台构建 + 签名 + 发布 Release + 上传产物
  tag_push:
    build-and-release:
      <<: *build-env
      stages:
        - *import-project
        - *scenario-lint
        - *headless-tests
        - name: build-all-platforms
          jobs:
            windows: *build-windows
            linux: *build-linux
            android: *build-android-release
        - name: package-artifacts
          script: |
            TAG="$CNB_BRANCH"
            cd release/win && zip -r "../../$PROJECT_NAME-$TAG-windows-x64.zip" . && cd ../..
            cd release/linux && tar czf "../../$PROJECT_NAME-$TAG-linux-x64.tar.gz" . && cd ../..
            cp release/android/*.apk "$PROJECT_NAME-$TAG-android.apk" 2>/dev/null || true
            echo "=== 打包完成 ==="
            ls -lah *.zip *.tar.gz *.apk 2>/dev/null || true
        - name: create-release
          type: git:release
          options:
            descriptionFromFile: CHANGELOG.md
        - name: upload-release-assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./*.zip"
              - "./*.tar.gz"
              - "./*.apk"
      failStages:
        - name: notify-failure
          script: |
            echo "Build failed: $CNB_BUILD_ID"

  # Web 手动触发：只构建不发布
  web_trigger:
    manual-build:
      <<: *build-env
      stages:
        - *import-project
        - *scenario-lint
        - *headless-tests
        - name: build-all-platforms
          jobs:
            windows: *build-windows
            linux: *build-linux
            android: *build-android-release
        - name: show-artifacts
          script: |
            echo "=== 构建产物 ==="
            find release/ -type f | sort
            du -sh release/*/
      failStages:
        - name: notify-failure
          script: |
            echo "Build failed: $CNB_BUILD_ID"

# ═══════════════════════════════════════════════════════════════
# Android 签名配置说明
# ═══════════════════════════════════════════════════════════════
#
# 【已配置】Release 签名通过密钥仓库 mico-v/secerts 自动注入。
#
# 密钥仓库 (mico-v/secerts, android-release.yml) 需包含：
#   ANDROID_KEYSTORE_B64:   base64 编码的 my-release-key.jks
#   ANDROID_KEYSTORE_ALIAS: keystore alias
#   ANDROID_KEYSTORE_PASS:  store password
#
# CI 运行时自动执行：
#   1. base64 解码 -> /root/release.jks
#   2. 写入 Godot editor_settings-4.tres
#   3. godot --export-release -> 自动使用 release keystore 签名
#   4. jarsigner -verify 验证签名
